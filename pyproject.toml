[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "djehuty-proof"
version = "0.1.0"
description = "Claim-to-evidence audit ledger with deterministic provenance"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dr. Ahmed Mohamed El Sayed"}]
[project.scripts]
djehuty = "djehuty_proof.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
